name: Deploy quotes site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "quotes-site/**"
      - "resources/qutoes.csv"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install sentence-transformers
        run: pip install sentence-transformers

      - name: Build embeddings
        run: python quotes-site/scripts/build_embeddings.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quotes-site
      - id: deployment
        uses: actions/deploy-pages@v4
