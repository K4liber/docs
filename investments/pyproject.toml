[project]
name = "active-investing"
version = "0.1.0"
description = "Collect and rank the largest public technology companies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "requests>=2.32,<3",
    "truststore>=0.10,<1",
]

[project.scripts]
active-investing = "active_investing.cli:main"

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/active_investing"]

[tool.hatch.build.targets.wheel.force-include]
"src/active_investing/default_ranking.toml" = "active_investing/default_ranking.toml"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
