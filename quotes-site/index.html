<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My favourite quotes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>My favourite quotes</h1>

    <div class="search-row">
      <input
        id="search"
        type="search"
        placeholder='e.g. "staying motivated through challenges"'
        autocomplete="off"
        autofocus
        disabled
      />
      <span id="status" class="status">loading model…</span>
    </div>

    <ul id="results" class="results"></ul>
    <nav id="pager" class="pager"></nav>

    <template id="card">
      <li class="card">
        <span class="index"></span>
        <blockquote></blockquote>
        <cite></cite>
      </li>
    </template>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
